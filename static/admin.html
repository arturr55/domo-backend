<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Домо — Админ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1a1a2e; }

  /* Login */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #191629 0%, #2d2a4a 100%);
  }
  .login-box {
    background: white; border-radius: 20px; padding: 40px;
    width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo svg { width: 56px; height: 56px; }
  .login-logo h1 { font-size: 24px; font-weight: 800; color: #1a1a2e; margin-top: 12px; }
  .login-logo p { color: #888; font-size: 13px; margin-top: 4px; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0f0;
    border-radius: 10px; font-size: 15px; outline: none; transition: border-color .2s;
  }
  .login-box input:focus { border-color: #7b68ee; }
  .login-box button {
    width: 100%; margin-top: 14px; padding: 13px;
    background: #7b68ee; color: white; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s;
  }
  .login-box button:hover { background: #6a55e0; }
  .login-error { color: #e74c3c; font-size: 13px; margin-top: 8px; text-align: center; }

  /* App */
  #app-screen { display: none; }

  /* Sidebar */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
    background: #191629; color: white; padding: 24px 0; z-index: 100;
  }
  .sidebar-logo { padding: 0 20px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-logo h2 { font-size: 20px; font-weight: 800; color: #7b68ee; }
  .sidebar-logo p { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 2px; }
  .sidebar nav { padding: 16px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px; cursor: pointer; color: rgba(255,255,255,.6);
    font-size: 14px; font-weight: 500; transition: all .15s; border-left: 3px solid transparent;
  }
  .nav-item:hover { color: white; background: rgba(255,255,255,.05); }
  .nav-item.active { color: white; background: rgba(123,104,238,.15); border-left-color: #7b68ee; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Main */
  .main { margin-left: 220px; padding: 28px; min-height: 100vh; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: white; border-radius: 14px; padding: 20px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .stat-card .label { font-size: 12px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .value { font-size: 32px; font-weight: 800; margin-top: 6px; }
  .stat-card.total .value { color: #7b68ee; }
  .stat-card.active .value { color: #00b894; }
  .stat-card.pending .value { color: #ff6b35; }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .toolbar h2 { font-size: 20px; font-weight: 700; flex: 1; }
  .filter-btn {
    padding: 8px 16px; border-radius: 8px; border: 1.5px solid #e0e0f0;
    background: white; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #555; transition: all .15s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: #7b68ee; color: #7b68ee; background: #f0eeff; }
  .search-input {
    padding: 8px 14px; border: 1.5px solid #e0e0f0; border-radius: 8px;
    font-size: 13px; outline: none; width: 200px; transition: border-color .2s;
  }
  .search-input:focus { border-color: #7b68ee; }
  .reload-btn {
    padding: 8px 14px; background: #7b68ee; color: white; border: none;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .reload-btn:hover { background: #6a55e0; }

  /* Table */
  .table-wrap { background: white; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #f8f8fc; }
  th { padding: 12px 14px; text-align: left; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 12px 14px; font-size: 13px; border-top: 1px solid #f0f0f8; vertical-align: middle; }
  tr:hover td { background: #fafafe; }

  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700;
  }
  .badge-rent { background: #ede9ff; color: #7b68ee; }
  .badge-sale { background: #e8f8f4; color: #00b894; }
  .badge-approved { background: #e8f8f4; color: #00b894; }
  .badge-rejected { background: #ffeee9; color: #ff6b35; }
  .badge-hot { background: #fff3ee; color: #ff6b35; }
  .badge-verified { background: #ede9ff; color: #7b68ee; }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 11px; font-weight: 700; transition: opacity .15s;
  }
  .btn:hover { opacity: .8; }
  .btn-approve { background: #00b894; color: white; }
  .btn-reject  { background: #ff6b35; color: white; }
  .btn-hot     { background: #ffeee9; color: #ff6b35; border: 1px solid #ffd4c4; }
  .btn-hot.on  { background: #ff6b35; color: white; }
  .btn-verify  { background: #ede9ff; color: #7b68ee; border: 1px solid #d4caff; }
  .btn-verify.on { background: #7b68ee; color: white; }
  .btn-delete  { background: #ffeef0; color: #e74c3c; border: 1px solid #ffd4d8; }

  .photo-thumb {
    width: 52px; height: 40px; object-fit: cover;
    border-radius: 6px; background: #eee;
  }
  .no-photo {
    width: 52px; height: 40px; border-radius: 6px;
    background: #f0f0f8; display: flex; align-items: center; justify-content: center;
    color: #ccc; font-size: 18px;
  }

  .title-cell { max-width: 200px; }
  .title-cell strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-cell span { color: #888; font-size: 11px; }

  .empty { padding: 48px; text-align: center; color: #aaa; font-size: 15px; }
  .loading { padding: 48px; text-align: center; color: #aaa; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 28px;
    max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .modal-close {
    float: right; background: #f0f0f8; border: none; border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .detail-label { color: #888; min-width: 110px; flex-shrink: 0; }
  .detail-val { font-weight: 500; }
  .photos-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .photos-row img { width: 100px; height: 80px; object-fit: cover; border-radius: 8px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px; background: #1a1a2e;
    color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px;
    font-weight: 600; opacity: 0; transition: opacity .3s; z-index: 9999;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="14" fill="#7b68ee"/>
        <path d="M28 14 L10 28 L18 28 L18 42 L38 42 L38 28 L46 28 Z" fill="white"/>
      </svg>
      <h1>Домо</h1>
      <p>Панель администратора</p>
    </div>
    <input type="password" id="token-input" placeholder="Введите admin-токен" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div id="login-error" class="login-error"></div>
    <button onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- App -->
<div id="app-screen">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h2>Домо</h2>
      <p>Администратор</p>
    </div>
    <nav>
      <div class="nav-item active" onclick="showTab('listings')" id="nav-listings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Объявления
      </div>
      <div class="nav-item" onclick="showTab('stats')" id="nav-stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Статистика
      </div>
      <div class="nav-item" onclick="doLogout()" style="margin-top:auto; position:absolute; bottom:24px; width:100%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </div>
    </nav>
  </div>

  <div class="main">

    <!-- Stats tab -->
    <div id="tab-stats" style="display:none">
      <div class="toolbar"><h2>Статистика</h2></div>
      <div class="stats-grid">
        <div class="stat-card total"><div class="label">Всего объявлений</div><div class="value" id="stat-total">—</div></div>
        <div class="stat-card active"><div class="label">Активных</div><div class="value" id="stat-approved">—</div></div>
        <div class="stat-card pending"><div class="label">Отклонённых</div><div class="value" id="stat-pending">—</div></div>
      </div>
    </div>

    <!-- Listings tab -->
    <div id="tab-listings">
      <div class="toolbar">
        <h2>Объявления</h2>
        <input class="search-input" id="search-input" placeholder="Поиск..." oninput="renderTable()">
        <button class="filter-btn active" onclick="setFilter('all')" id="f-all">Все</button>
        <button class="filter-btn" onclick="setFilter('active')" id="f-active">Активные</button>
        <button class="filter-btn" onclick="setFilter('rejected')" id="f-rejected">Отклонённые</button>
        <button class="reload-btn" onclick="loadListings()">↻ Обновить</button>
      </div>
      <div class="table-wrap">
        <div id="table-body"><div class="loading">Загрузка...</div></div>
      </div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast"></div>

<script>
const API = 'https://domo-backend-production.up.railway.app';
let TOKEN = '';
let allListings = [];
let currentFilter = 'all';

function doLogin() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  TOKEN = t;
  fetch(`${API}/admin/stats?token=${encodeURIComponent(t)}`)
    .then(r => {
      if (r.status === 403) throw new Error('Неверный токен');
      return r.json();
    })
    .then(() => {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      loadListings();
      loadStats();
    })
    .catch(e => {
      document.getElementById('login-error').textContent = e.message;
    });
}

function doLogout() {
  TOKEN = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('token-input').value = '';
}

function showTab(tab) {
  document.getElementById('tab-listings').style.display = tab === 'listings' ? 'block' : 'none';
  document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  if (tab === 'stats') loadStats();
}

function loadStats() {
  fetch(`${API}/admin/stats?token=${encodeURIComponent(TOKEN)}`)
    .then(r => r.json())
    .then(d => {
      document.getElementById('stat-total').textContent = d.total ?? '—';
      document.getElementById('stat-approved').textContent = d.approved ?? '—';
      document.getElementById('stat-pending').textContent = d.pending ?? '—';
    });
}

function loadListings() {
  document.getElementById('table-body').innerHTML = '<div class="loading">Загрузка...</div>';
  fetch(`${API}/admin/listings?token=${encodeURIComponent(TOKEN)}`)
    .then(r => r.json())
    .then(data => {
      allListings = data;
      renderTable();
    });
}

function setFilter(f) {
  currentFilter = f;
  ['all','active','rejected'].forEach(k => {
    document.getElementById('f-' + k).classList.toggle('active', k === f);
  });
  renderTable();
}

function renderTable() {
  const search = document.getElementById('search-input').value.toLowerCase();
  let list = allListings;

  if (currentFilter === 'active')   list = list.filter(l => l.approved);
  if (currentFilter === 'rejected') list = list.filter(l => !l.approved);
  if (search) list = list.filter(l =>
    (l.title || '').toLowerCase().includes(search) ||
    (l.city  || '').toLowerCase().includes(search) ||
    (l.phone || '').toLowerCase().includes(search) ||
    (l.contact_name || '').toLowerCase().includes(search)
  );

  if (list.length === 0) {
    document.getElementById('table-body').innerHTML = '<div class="empty">Объявлений нет</div>';
    return;
  }

  const rows = list.map(l => {
    const photo = l.photos && l.photos.length > 0
      ? `<img class="photo-thumb" src="data:image/jpeg;base64,${l.photos[0]}" onerror="this.style.display='none'">`
      : `<div class="no-photo">🏠</div>`;
    const price = l.price >= 1000000
      ? (l.price/1000000).toFixed(1) + ' млн'
      : l.price >= 1000 ? Math.round(l.price/1000) + ' тыс.' : l.price;
    const date = l.created_at ? new Date(l.created_at).toLocaleDateString('ru') : '';
    const status = l.approved
      ? '<span class="badge badge-approved">✓ Активно</span>'
      : '<span class="badge badge-rejected">✗ Откл.</span>';
    const deal = l.deal_type === 'sale'
      ? '<span class="badge badge-sale">Продажа</span>'
      : '<span class="badge badge-rent">Аренда</span>';
    const hotCls = l.is_hot ? 'on' : '';
    const verCls = l.is_verified ? 'on' : '';

    return `<tr>
      <td>${photo}</td>
      <td class="title-cell">
        <strong>${esc(l.title)}</strong>
        <span>${esc(l.city)}${l.district ? ', ' + esc(l.district) : ''}</span>
      </td>
      <td>${deal}</td>
      <td><strong>${price} ₽</strong>${l.deal_type==='rent'?'<br><span style="color:#aaa;font-size:11px">/мес</span>':''}</td>
      <td>${esc(l.contact_name||'—')}<br><span style="color:#aaa;font-size:11px">${esc(l.phone||'')}</span></td>
      <td>${status}</td>
      <td style="color:#aaa;font-size:12px">${date}</td>
      <td>
        <div class="actions">
          ${l.approved
            ? `<button class="btn btn-reject" onclick="action(${l.id},'reject')">Откл.</button>`
            : `<button class="btn btn-approve" onclick="action(${l.id},'approve')">✓ Одобрить</button>`}
          <button class="btn btn-hot ${hotCls}" onclick="action(${l.id},'hot',${!l.is_hot})" title="Горячее">🔥</button>
          <button class="btn btn-verify ${verCls}" onclick="action(${l.id},'verified',${!l.is_verified})" title="Проверено">✓</button>
          <button class="btn btn-delete" onclick="deleteListing(${l.id})">✕</button>
          <button class="btn" style="background:#f0f0f8;color:#555;" onclick="showDetail(${l.id})">👁</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('table-body').innerHTML = `
    <table>
      <thead><tr>
        <th>Фото</th><th>Название</th><th>Тип</th><th>Цена</th>
        <th>Контакт</th><th>Статус</th><th>Дата</th><th>Действия</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function action(id, type, value) {
  let url = `${API}/admin/listings/${id}/${type}?token=${encodeURIComponent(TOKEN)}`;
  if (value !== undefined) url += `&value=${value}`;
  const r = await fetch(url, { method: 'PATCH' });
  if (r.ok) {
    toast(type === 'approve' ? 'Одобрено ✓' : type === 'reject' ? 'Отклонено' : 'Обновлено');
    await loadListings();
  }
}

async function deleteListing(id) {
  if (!confirm('Удалить объявление #' + id + '?')) return;
  const r = await fetch(`${API}/admin/listings/${id}?token=${encodeURIComponent(TOKEN)}`, { method: 'DELETE' });
  if (r.ok) { toast('Удалено'); await loadListings(); }
}

function showDetail(id) {
  const l = allListings.find(x => x.id === id);
  if (!l) return;
  const photos = (l.photos || []).map(p =>
    `<img src="data:image/jpeg;base64,${p}" onerror="this.style.display='none'">`
  ).join('');
  const amenMap = {wifi:'Wi-Fi',parking:'Паркинг',balcony:'Балкон',elevator:'Лифт',
    security:'Охрана',gym:'Зал',pool:'Бассейн',washer:'Стиралка',
    ac:'Кондиционер',furniture:'Мебель',fridge:'Холодильник',dishwasher:'Посудомойка'};
  const amenities = (l.amenities||[]).map(a => amenMap[a]||a).join(', ') || '—';
  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">Закрыть</button>
    <h3>#${l.id} — ${esc(l.title)}</h3>
    <div class="detail-row"><span class="detail-label">Город</span><span class="detail-val">${esc(l.city)}${l.district?', '+esc(l.district):''}</span></div>
    <div class="detail-row"><span class="detail-label">Адрес</span><span class="detail-val">${esc(l.address)}</span></div>
    <div class="detail-row"><span class="detail-label">Тип сделки</span><span class="detail-val">${l.deal_type==='rent'?'Аренда':'Продажа'}</span></div>
    <div class="detail-row"><span class="detail-label">Цена</span><span class="detail-val">${l.price} ₽${l.deal_type==='rent'?'/мес':''}</span></div>
    <div class="detail-row"><span class="detail-label">Площадь</span><span class="detail-val">${l.area?l.area+' м²':'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Этаж</span><span class="detail-val">${l.floor?l.floor+(l.floors_total?' / '+l.floors_total:''):'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Комнат</span><span class="detail-val">${l.rooms||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Метро</span><span class="detail-val">${l.metro_station?l.metro_station+(l.metro_minutes?' — '+l.metro_minutes+' мин':''):'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Удобства</span><span class="detail-val">${amenities}</span></div>
    <div class="detail-row"><span class="detail-label">Контакт</span><span class="detail-val">${esc(l.contact_name||'—')}</span></div>
    <div class="detail-row"><span class="detail-label">Телефон</span><span class="detail-val">${esc(l.phone||'—')}</span></div>
    <div class="detail-row"><span class="detail-label">Telegram</span><span class="detail-val">${l.telegram?'@'+esc(l.telegram):'—'}</span></div>
    <div class="detail-row"><span class="detail-label">Описание</span><span class="detail-val">${esc(l.description||'—')}</span></div>
    <div class="detail-row"><span class="detail-label">Просмотры</span><span class="detail-val">${l.views}</span></div>
    <div class="photos-row">${photos}</div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
